# Production overlay.
#
#   docker compose -f docker-compose.yml \
#                  -f infrastructure/deployment/docker-compose.prod.yml up -d
#
# Use infrastructure/deployment/deploy.sh rather than running this by hand —
# it brings the services up in the order the build requires and gates on
# health checks.
#
# Requires Docker Compose v2.24.4 or later, for the `!override` tag used to
# clear the development port publishes. An older version errors rather than
# ignoring it, so this cannot silently leave ports exposed.
#
# What this overlay changes from the base file:
#   * adds nginx, the only service exposed to the internet
#   * stops publishing web and api ports at all; they are reachable only on
#     the private Docker network
#   * pins restart policies and log rotation
#   * mounts persistent volumes for media and TLS material

name: deetech

services:
  db:
    restart: always
    # No ports, in the base file and here. Section 9 of the plan: PostgreSQL
    # stays off public interfaces.
    volumes:
      - db-data:/var/lib/postgresql/data
    # A small VPS; these are modest and deliberate rather than defaults.
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=1000

  api:
    restart: always
    # Overrides the base file's loopback publish: in production nothing
    # reaches the API except nginx, over the private network.
    ports: !override []
    environment:
      NODE_ENV: production
    volumes:
      - media-data:/var/lib/deetech/media

  web:
    restart: always
    ports: !override []
    build:
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL must be set}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        API_BASE_URL: http://api:4000
      # `next build` prerenders content pages by calling the API, so the
      # build has to reach it. Without that the build still SUCCEEDS and
      # ships a site with no services, brands or articles, which is the
      # worst kind of failure.
      #
      # `network: deetech_net` was the obvious way to arrange this and it
      # does NOT work. `build.network` is a classic-builder feature, and
      # buildkit — the default since Docker 23 — rejects it outright:
      #   network mode "deetech_net" not supported by buildkit
      # It fails the build rather than ignoring it, which is the one mercy.
      #
      # So deploy.sh builds with a buildx builder that is itself attached to
      # deetech_net, and passes the API container's current address here.
      # Being on the network is not sufficient on its own: buildkit replaces
      # resolv.conf inside RUN sandboxes with public DNS, so Docker's
      # embedded resolver at 127.0.0.11 is unreachable and the name has to
      # come from /etc/hosts. Doing it this way keeps API_BASE_URL byte for
      # byte identical at build time and at runtime.
      #
      # The fallback is loopback on purpose. A build that forgets to set
      # this gets connection-refused at once instead of hanging, and the
      # prerendered-page guard in deploy.sh then fails the deploy.
      extra_hosts:
        - "api:${API_BUILD_IP:-127.0.0.1}"
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Config is read-only inside the container; edit it in the repo and
      # redeploy rather than in place.
      #
      # Paths are relative to the PROJECT directory — where docker-compose.yml
      # lives — not to this file. Compose resolves relative paths in an
      # override against the project directory, so the `../nginx/...` these
      # once were resolved to /srv/deetech/nginx and nginx would not start.
      - ./infrastructure/nginx/deetechgroup.conf:/etc/nginx/conf.d/default.conf:ro
      # /etc/nginx/deetech rather than /etc/nginx/snippets, so the path is
      # the same here and on a host nginx, where /etc/nginx/snippets is
      # already Debian's own.
      - ./infrastructure/nginx/snippets:/etc/nginx/deetech:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      # The WordPress uploads directory, copied across at cutover so old
      # image URLs keep working. Read-only: nothing writes here again.
      - ${LEGACY_UPLOADS_DIR:-/srv/deetech/legacy-uploads}:/srv/deetech/legacy-uploads:ro
    networks:
      - deetech
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: &prod-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Renews certificates and exits. Run from cron, or leave it running with
  # the sleep loop below — the loop is simpler to reason about on one host.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Checks twice a day; certbot itself is a no-op until a certificate is
    # within 30 days of expiry.
    entrypoint: >
      sh -c 'trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done'
    logging: *prod-logging

networks:
  deetech:
    name: deetech_net
    driver: bridge

volumes:
  db-data:
  media-data:
  certbot-conf:
  certbot-www:
