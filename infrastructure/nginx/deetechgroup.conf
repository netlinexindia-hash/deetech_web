# Production: nginx in a container, the only service exposed.
#
# Runs as the `nginx` service in infrastructure/deployment/docker-compose.prod.yml.
# The apps are reachable only on the private Docker network, which is why
# the upstreams below are service names rather than 127.0.0.1.
#
#   DEPLOY_MODE=container-nginx infrastructure/deployment/deploy.sh
#
# If you run nginx on the host instead — forwarding to loopback publishes —
# this is the wrong file. Use deetechgroup-host.conf, and note that the
# upstreams are the whole difference: pointing host nginx at `web:3000`
# cannot work, and pointing container nginx at `127.0.0.1:3000` reaches
# nothing but the nginx container itself.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf. Edit it here and
# redeploy; do not edit it in the container.
#
# Requires, before `up`:
#   * a certificate at /etc/letsencrypt/live/www.deetechgroup.com/ (see
#     docs/06-deployment-runbook.md for the bootstrap, which has to happen
#     over HTTP before this config can load)
#   * the snippets directory mounted at /etc/nginx/deetech/

limit_req_zone $binary_remote_addr zone=enquiries:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=10r/m;

upstream deetech_web {
    # Docker service name, resolved on the private `deetech` network.
    server web:3000;
    keepalive 16;
}

upstream deetech_api {
    server api:4000;
    keepalive 16;
}

# --- Redirect apex to www, and http to https -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name deetechgroup.com www.deetechgroup.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The container health check runs inside the network over HTTP, so it
    # must not be caught by the redirect to HTTPS below.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok
";
    }

    location / {
        return 301 https://www.deetechgroup.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deetechgroup.com;

    ssl_certificate     /etc/letsencrypt/live/www.deetechgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.deetechgroup.com/privkey.pem;

    return 301 https://www.deetechgroup.com$request_uri;
}

# --- Canonical host --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.deetechgroup.com;

    ssl_certificate     /etc/letsencrypt/live/www.deetechgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.deetechgroup.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;
    # OCSP stapling needs a resolver. This is Docker's embedded DNS, which
    # forwards to the daemon's configured resolvers.
    resolver 127.0.0.11 ipv6=off valid=300s;
    resolver_timeout 5s;

    # The old WordPress site sent none of these. See section 7 of the Day 1
    # audit.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # CSP is set by the application, which knows its own script hashes.

    server_tokens off;
    client_max_body_size 6m;   # must exceed MEDIA_MAX_UPLOAD_BYTES

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/rss+xml;

    access_log /var/log/nginx/deetechgroup.access.log;
    error_log  /var/log/nginx/deetechgroup.error.log warn;

    # Answered by nginx itself, so it reports whether the proxy is up rather
    # than whether the apps behind it are. Their own health checks cover them.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok
";
    }

    include /etc/nginx/deetech/deetech-locations.conf;
}
