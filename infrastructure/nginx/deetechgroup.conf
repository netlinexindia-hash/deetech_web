# nginx reverse proxy for the DeeTech Group site.
#
# Runs as the `nginx` service in infrastructure/deployment/docker-compose.prod.yml,
# which is the only service exposed to the internet. The apps are reachable
# only on the private Docker network — that is why the upstreams below are
# service names rather than 127.0.0.1.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf. Edit it here and
# redeploy; do not edit it in the container.
#
# Requires, before `up`:
#   * a certificate at /etc/letsencrypt/live/www.deetechgroup.com/
#     (see docs/06-deployment-runbook.md for the bootstrap, which has to
#     happen over HTTP before this config can load)
#   * /etc/nginx/snippets/deetech-redirects.conf, generated from
#     docs/redirects.csv by `npm run redirects:build`

# Rate-limit zone for the public enquiry endpoint. 5 r/m with a small burst is
# generous for a human and hostile to a bot.
limit_req_zone $binary_remote_addr zone=enquiries:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=10r/m;

upstream deetech_web {
    # Docker service name, resolved on the private `deetech` network.
    server web:3000;
    keepalive 16;
}

upstream deetech_api {
    server api:4000;
    keepalive 16;
}

# --- Redirect apex to www, and http to https -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name deetechgroup.com www.deetechgroup.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The container health check runs inside the network over HTTP, so it
    # must not be caught by the redirect to HTTPS below.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok
";
    }

    location / {
        return 301 https://www.deetechgroup.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deetechgroup.com;

    ssl_certificate     /etc/letsencrypt/live/www.deetechgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.deetechgroup.com/privkey.pem;

    return 301 https://www.deetechgroup.com$request_uri;
}

# --- Canonical host --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.deetechgroup.com;

    ssl_certificate     /etc/letsencrypt/live/www.deetechgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.deetechgroup.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # The current WordPress site sends none of these. See section 7 of the
    # Day 1 audit.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # CSP is set by the application, which knows its own script hashes.

    server_tokens off;
    client_max_body_size 6m;   # must exceed MEDIA_MAX_UPLOAD_BYTES

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/rss+xml;

    access_log /var/log/nginx/deetechgroup.access.log;
    error_log  /var/log/nginx/deetechgroup.error.log warn;

    # --- container health check -------------------------------------------
    # Answered by nginx itself, so it reports whether the proxy is up rather
    # than whether the apps behind it are. Their own health checks cover them.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok
";
    }

    # --- uploaded media ----------------------------------------------------
    # Proxied to the API, which serves the persistent volume. Content stores
    # origin-relative /media/... URLs, so this is what makes them resolve.
    location /media/ {
        proxy_pass http://deetech_api;
        include /etc/nginx/snippets/deetech-proxy.conf;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --- Legacy WordPress 301s --------------------------------------------
    # Generated from docs/redirects.csv. Applied and verified on Day 22.
    include /etc/nginx/snippets/deetech-redirects.conf;

    # --- Block legacy WordPress endpoints ---------------------------------
    location = /xmlrpc.php      { return 410; }
    location = /wp-login.php    { return 410; }
    location ^~ /wp-admin/      { return 410; }
    location ^~ /wp-includes/   { return 410; }

    # Old uploads stay reachable so any external link to an image keeps
    # working after cutover. Serve them from a read-only copy of the
    # WordPress uploads directory, not from the WordPress install.
    location ^~ /wp-content/uploads/ {
        alias /srv/deetech/legacy-uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- Enquiry endpoint: rate limited -----------------------------------
    location = /api/v1/enquiries {
        limit_req zone=enquiries burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://deetech_api;
        include /etc/nginx/snippets/deetech-proxy.conf;
    }

    location = /api/v1/admin/login {
        limit_req zone=adminlogin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://deetech_api;
        include /etc/nginx/snippets/deetech-proxy.conf;
    }

    location /api/ {
        proxy_pass http://deetech_api;
        include /etc/nginx/snippets/deetech-proxy.conf;
    }

    # --- Next.js static assets: content-hashed, cache hard ----------------
    location /_next/static/ {
        proxy_pass http://deetech_web;
        include /etc/nginx/snippets/deetech-proxy.conf;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --- Everything else: the Next.js server ------------------------------
    location / {
        proxy_pass http://deetech_web;
        include /etc/nginx/snippets/deetech-proxy.conf;
    }
}
