# Local / staging verification. nginx on the host, plain HTTP, no domain.
#
#   sudo ln -sfn /srv/deetech/site/infrastructure/nginx/snippets /etc/nginx/deetech
#   sudo cp infrastructure/nginx/staging-local.conf /etc/nginx/sites-available/deetech
#   sudo ln -sfn /etc/nginx/sites-available/deetech /etc/nginx/sites-enabled/deetech
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is the same topology as production — nginx on the host forwarding to
# the containers on loopback — with TLS and the canonical hostname removed,
# because a LAN box has neither. Use it to verify the stack end to end
# before deploying anywhere real.
#
# NOT for production. It serves plain HTTP on any hostname and sends no
# HSTS. Production is deetechgroup-host.conf.
#
# Requires the stack to be up with web and api published on loopback:
#   DEPLOY_MODE=host-nginx infrastructure/deployment/deploy.sh

limit_req_zone $binary_remote_addr zone=enquiries:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=10r/m;

upstream deetech_web {
    # Published on loopback by the host-nginx compose overlay.
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream deetech_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Answers on whatever name or address the box has, which on a LAN is an
    # IP. Nothing here redirects to a canonical host, so the site is
    # reachable as-is.
    server_name _;

    # Everything except HSTS, which has no business on plain HTTP.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # CSP is set by the application, which knows its own script hashes.

    server_tokens off;
    client_max_body_size 6m;   # must exceed MEDIA_MAX_UPLOAD_BYTES

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/rss+xml;

    access_log /var/log/nginx/deetech-staging.access.log;
    error_log  /var/log/nginx/deetech-staging.error.log warn;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok
";
    }

    include /etc/nginx/deetech/deetech-locations.conf;
}
