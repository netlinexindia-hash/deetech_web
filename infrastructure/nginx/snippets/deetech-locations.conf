# Everything the site serves, shared by every deployment topology.
#
# Installed at /etc/nginx/deetech/deetech-locations.conf and included from
# inside a `server { }` block. The server block owns listen, server_name,
# TLS and the response headers; this file owns routing.
#
# It is shared on purpose. There are three server configs in this directory
# and they differ only in how they are reached:
#
#   deetechgroup.conf       nginx in a container, upstreams are service names
#   deetechgroup-host.conf  nginx on the host, upstreams are 127.0.0.1
#   staging-local.conf      nginx on the host, plain HTTP, for local testing
#
# Week 6 shipped a bug that came straight out of having two near-identical
# copies of this routing: one had `127.0.0.1` upstreams and the other had
# service names, and only one of them was right for the topology actually in
# use. Keeping the routing in one file is what stops that happening again.
# Both upstream names below are defined by whichever server config includes
# this, so this file never needs to know where the apps are.

# --- uploaded media --------------------------------------------------------
# Proxied to the API, which serves the persistent volume. Content stores
# origin-relative /media/... URLs, so this is what makes them resolve.
location /media/ {
    proxy_pass http://deetech_api;
    include /etc/nginx/deetech/deetech-proxy.conf;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# --- Legacy WordPress 301s -------------------------------------------------
# Generated from docs/redirects.csv by
# `node infrastructure/deployment/generate-redirects.mjs`. Committed, and CI
# fails if it has drifted from the CSV.
include /etc/nginx/deetech/deetech-redirects.conf;

# --- Block legacy WordPress endpoints --------------------------------------
location = /xmlrpc.php      { return 410; }
location = /wp-login.php    { return 410; }
location ^~ /wp-admin/      { return 410; }
location ^~ /wp-includes/   { return 410; }

# Old uploads stay reachable so any external link to an image keeps working
# after cutover. Served from a read-only copy of the WordPress uploads
# directory, not from the WordPress install.
location ^~ /wp-content/uploads/ {
    alias /srv/deetech/legacy-uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# --- Enquiry endpoint: rate limited ----------------------------------------
# The zones are defined in the http context by each server config's file.
location = /api/v1/enquiries {
    limit_req zone=enquiries burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://deetech_api;
    include /etc/nginx/deetech/deetech-proxy.conf;
}

location = /api/v1/admin/login {
    limit_req zone=adminlogin burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://deetech_api;
    include /etc/nginx/deetech/deetech-proxy.conf;
}

location /api/ {
    proxy_pass http://deetech_api;
    include /etc/nginx/deetech/deetech-proxy.conf;
}

# --- Next.js static assets: content-hashed, cache hard ---------------------
location /_next/static/ {
    proxy_pass http://deetech_web;
    include /etc/nginx/deetech/deetech-proxy.conf;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# --- Everything else: the Next.js server -----------------------------------
location / {
    proxy_pass http://deetech_web;
    include /etc/nginx/deetech/deetech-proxy.conf;
}
