# Production: nginx on the host, forwarding to the containers on loopback.
#
#   sudo ln -sfn /srv/deetech/site/infrastructure/nginx/snippets /etc/nginx/deetech
#   sudo cp infrastructure/nginx/deetechgroup-host.conf /etc/nginx/sites-available/deetech
#   sudo ln -sfn /etc/nginx/sites-available/deetech /etc/nginx/sites-enabled/deetech
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy the stack in the matching topology, which publishes web and api on
# loopback instead of running nginx in a container:
#
#   DEPLOY_MODE=host-nginx infrastructure/deployment/deploy.sh
#
# Requires, before nginx will load this file:
#   * a certificate at /etc/letsencrypt/live/www.deetechgroup.com/ — issue it
#     with the host certbot BEFORE enabling this config, because nginx will
#     not start without the files and the HTTP-01 challenge needs nginx:
#       sudo certbot certonly --webroot -w /var/www/certbot \
#            -d deetechgroup.com -d www.deetechgroup.com
#     With nothing yet serving port 80, use `--standalone` instead.
#   * /etc/nginx/deetech/ pointing at the repo's snippets directory, as above.
#     That directory is used rather than /etc/nginx/snippets/ so it does not
#     collide with the one Debian and Ubuntu ship.
#   * /var/www/certbot existing and writable by certbot, for renewals.
#
# Because nginx is on the host, ufw governs ports 80 and 443 normally — the
# "Docker bypasses ufw" caveat in the runbook does not apply to them. It
# still applies to anything Docker publishes, which is why the overlay binds
# web and api to 127.0.0.1 and not to 0.0.0.0.

limit_req_zone $binary_remote_addr zone=enquiries:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=10r/m;

upstream deetech_web {
    # Published on loopback by the host-nginx compose overlay. Not reachable
    # from off the box: the publish is bound to 127.0.0.1, not 0.0.0.0.
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream deetech_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# --- Redirect apex to www, and http to https -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name deetechgroup.com www.deetechgroup.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok
";
    }

    location / {
        return 301 https://www.deetechgroup.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deetechgroup.com;

    ssl_certificate     /etc/letsencrypt/live/www.deetechgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.deetechgroup.com/privkey.pem;

    return 301 https://www.deetechgroup.com$request_uri;
}

# --- Canonical host --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.deetechgroup.com;

    ssl_certificate     /etc/letsencrypt/live/www.deetechgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.deetechgroup.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;
    # OCSP stapling needs a resolver to fetch the response. This is the
    # systemd-resolved stub that Ubuntu runs; without it nginx logs
    # "ssl_stapling ignored" and serves fine but unstapled.
    resolver 127.0.0.53 ipv6=off valid=300s;
    resolver_timeout 5s;

    # The old WordPress site sent none of these. See section 7 of the Day 1
    # audit.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # CSP is set by the application, which knows its own script hashes.

    server_tokens off;
    client_max_body_size 6m;   # must exceed MEDIA_MAX_UPLOAD_BYTES

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/rss+xml;

    access_log /var/log/nginx/deetechgroup.access.log;
    error_log  /var/log/nginx/deetechgroup.error.log warn;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok
";
    }

    include /etc/nginx/deetech/deetech-locations.conf;
}
