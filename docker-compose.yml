# Local development stack.
#
#   cp .env.example .env   # then edit
#   docker compose up --build
#
# Production uses this file plus infrastructure/deployment/docker-compose.prod.yml,
# which adds the nginx service, TLS and restart policies.
#
# Ports: only the web app and the API are published, and only to 127.0.0.1.
# PostgreSQL is reachable on the private `deetech` network and nowhere else.

name: deetech

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deetech}
      POSTGRES_USER: ${POSTGRES_USER:-deetech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Encoding and collation are pinned rather than inherited from the
      # image's locale, so every environment agrees. The embedded Postgres
      # used for local development pins the same values — without it, initdb
      # picked up the Windows locale and produced a WIN1252 cluster that
      # rejected characters production accepts.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8 --no-locale"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - deetech
    # No `ports:` on purpose. To inspect the database locally, either exec into
    # the container or uncomment a 127.0.0.1-bound mapping in
    # docker-compose.override.yml (git-ignored).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-deetech} -d ${POSTGRES_DB:-deetech}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    # Every key in the API's config schema (apps/api/src/config.ts) has to be
    # listed here. A container does not inherit .env — compose only passes
    # what this block names, and anything absent silently falls back to the
    # schema default.
    #
    # That is how the SMTP settings went missing: they were in .env.example
    # and in the config schema but never passed through, so filling in
    # credentials would have changed nothing. The mailer no-ops without
    # SMTP_HOST by design, so nothing would have errored — enquiries would
    # have kept saving and no email would ever have been sent.
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 4000
      API_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}

      # Optional as a group. With no SMTP_HOST the mailer logs instead of
      # sending, which is the correct development behaviour and a silent
      # failure in production — see §9 of the runbook.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-DeeTech Group <no-reply@deetechgroup.com>}
      ENQUIRY_NOTIFICATION_TO: ${ENQUIRY_NOTIFICATION_TO:-support@deetechgroup.com}

      ENQUIRY_MAX_PER_WINDOW: ${ENQUIRY_MAX_PER_WINDOW:-5}
      ENQUIRY_WINDOW_MINUTES: ${ENQUIRY_WINDOW_MINUTES:-60}

      MEDIA_STORAGE_PATH: /var/lib/deetech/media
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-5242880}
    volumes:
      - media-data:/var/lib/deetech/media
    networks:
      - deetech
    ports:
      # Bound to loopback: the host can reach it, the internet cannot.
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: ${API_BASE_URL:-http://api:4000}
    networks:
      - deetech
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      # `service_started`, not `service_healthy`: the site must still render
      # (with graceful fallbacks) when the API is briefly unavailable.
      api:
        condition: service_started
    logging: *default-logging

networks:
  deetech:
    # Named explicitly rather than letting compose prefix it with the
    # project name, so `build.network` in the production overlay can refer
    # to it by a name that does not change.
    name: deetech_net
    driver: bridge

volumes:
  db-data:
  media-data:
# A Docker volume is not a backup. Database and media are dumped to off-server
# storage by infrastructure/deployment/backup.sh (Week 5, Day 25).
